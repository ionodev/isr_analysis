name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries (FFTW for pyfftw, MPI for mpi4py)
        run: sudo apt-get update && sudo apt-get install -y libfftw3-dev libopenmpi-dev openmpi-bin
      - name: Python packages
        run: pip install -r requirements.txt pytest
      - name: Tests
        run: python -m pytest -q tests
